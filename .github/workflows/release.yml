name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python files
        run: python -m py_compile server.py tests/test_workflow.py
      - name: Run workflow tests
        run: python -m unittest discover -s tests -v
      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/TreasurersSupplyInventory | Out-Null
          Copy-Item server.py, launcher.bat, README.md -Destination dist/TreasurersSupplyInventory
          Copy-Item web -Destination dist/TreasurersSupplyInventory -Recurse
          Compress-Archive -Path dist/TreasurersSupplyInventory -DestinationPath dist/TreasurersSupplyInventory-${{ github.ref_name }}.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/TreasurersSupplyInventory-${{ github.ref_name }}.zip
